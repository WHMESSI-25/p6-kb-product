<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汕大办事指南知识库</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; background: #f2f4f8; height: 100vh; display: flex; justify-content: center; }
  #wrap { width: 100%; max-width: 780px; display: flex; flex-direction: column; }
  header { background: #1a5fb4; color: #fff; padding: 14px 20px; font-size: 17px; font-weight: bold; }
  header small { font-weight: normal; opacity: .85; margin-left: 8px; }
  #chat { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .bubble { max-width: 88%; padding: 10px 14px; border-radius: 12px; margin-bottom: 12px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; font-size: 15px; }
  .user { background: #1a5fb4; color: #fff; margin-left: auto; }
  .bot { background: #fff; color: #222; }
  .refuse { background: #fff7e6; border: 1px solid #f0c36d; }
  .srcs { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #ddd; font-size: 12.5px; }
  .srcs a { color: #1a5fb4; text-decoration: none; margin-right: 10px; }
  .srcs a:hover { text-decoration: underline; }
  .score { color: #999; margin-left: 6px; }
  .bar { display: flex; gap: 8px; padding: 12px 16px; background: #fff; border-top: 1px solid #e5e8ef; }
  #q { flex: 1; padding: 10px 12px; border: 1px solid #ccd2dd; border-radius: 8px; font-size: 15px; outline: none; }
  #q:focus { border-color: #1a5fb4; }
  button { background: #1a5fb4; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  .hint { color: #888; font-size: 12.5px; text-align: center; margin: 8px 0 14px; }
  .loading { color: #888; font-size: 13px; margin-bottom: 12px; }
</style>
</head>
<body>
<div id="wrap">
  <header>汕大办事指南知识库<small>基于学校信息公开网·办事指南语料 · RAG 演示</small></header>
  <div id="chat">
    <div class="bubble bot">你好！我是汕大办事指南知识库助手。<br>可以问我学校各类办事流程，比如「勤工助学一周最多干几个小时？」。</div>
    <div class="hint">回答基于学校公开的办事指南语料；知识库没有的内容会明确告知，不会编造。</div>
  </div>
  <div class="bar">
    <input id="q" placeholder="输入你的问题，回车发送…" maxlength="200">
    <button id="send">发送</button>
  </div>
</div>
<script>
const chat = document.getElementById('chat');
const qBox = document.getElementById('q');
const sendBtn = document.getElementById('send');

function addBubble(cls, html) {
  const d = document.createElement('div');
  d.className = 'bubble ' + cls;
  d.innerHTML = html;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function ask() {
  const question = qBox.value.trim();
  if (!question) return;
  qBox.value = ''; sendBtn.disabled = true;
  addBubble('user', esc(question));
  const loading = addBubble('loading', '检索语料并生成回答中…');
  try {
    const resp = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });
    const data = await resp.json();
    loading.remove();
    if (data.error) { addBubble('bot', '⚠ ' + esc(data.error)); return; }
    const cls = data.no_hit ? 'bot refuse' : 'bot';
    let html = esc(data.answer);
    if (data.sources && data.sources.length) {
      html += '<div class="srcs">📎 出处：' + data.sources.map(s =>
        `<a href="${escAttr(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a><span class="score">(${(s.score * 100).toFixed(0)}%${data.no_hit ? '' : ' 相关'})</span>`
      ).join('') + '</div>';
    }
    addBubble(cls, html);
  } catch (e) {
    loading.remove();
    addBubble('bot', '⚠ 网络错误，请重试');
  } finally {
    sendBtn.disabled = false; qBox.focus();
  }
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escAttr(s) {
  return esc(s).replace(/"/g, '&quot;');
}

sendBtn.onclick = ask;
qBox.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
</script>
</body>
</html>
